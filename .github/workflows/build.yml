name: Build & Package Visagel (APK & ZIP)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build Web App & Package Downloadable ZIP
  # ─────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web App & Downloadable ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Expo Web bundle
        run: npx expo export --platform web

      - name: Compress Web bundle to ZIP archive
        run: |
          cd dist
          zip -r ../visagel-web-app.zip .
          cd ..

      - name: Upload Web ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Visagel-Web-ZIP
          path: visagel-web-app.zip
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Android APK
  # ─────────────────────────────────────────────────────────────────────────────
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Set Gradle execution permissions
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Organize output APK file
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Visagel-v1.0.0.apk \;

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Visagel-Android-APK
          path: build-output/Visagel-v1.0.0.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Create GitHub Release (Triggered on git tag push e.g. v1.0.0)
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-web, build-android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: Visagel-Web-ZIP
          path: release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Visagel-Android-APK
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/visagel-web-app.zip
            release-assets/Visagel-v1.0.0.apk
          body: |
            ## Visagel Automated Build Release 🚀

            ### Download Links:
            - **Android APK**: Download `Visagel-v1.0.0.apk` below to install directly on your Android device.
            - **Web Bundle**: Download `visagel-web-app.zip` for offline / web server deployment.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
